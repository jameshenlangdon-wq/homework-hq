<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF1EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F7563'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23F9FBF9' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async></script>
<title>Homework HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Type-to-add bar on top, one highlighted "do this next" card, then due-date buckets. */
:root{
  /* calm palette: sage paper, one muted teal accent, softened status colors */
  --paper:#EDF1EE; --card:#F9FBF9; --ink:#22302A; --muted:#66776F; --line:#D8E1DB;
  --hi:#DFEBE5; --hi-ink:#22302A; --pen:#2F7563; --pen-soft:#DCEBE5;
  --late:#B0473F; --late-soft:#F5E3E0; --today:#A5701F; --today-soft:#F5EBD9; --ok:#2F7563; --ok-soft:#DCEBE5;
  --display:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131917; --card:#1B2320; --ink:#DCE5E0; --muted:#8D9F97; --line:#2A3531;
  --hi:#1F2E29; --hi-ink:#DCE5E0; --pen:#7DC0AC; --pen-soft:#22342E;
  --late:#E38B83; --late-soft:#3A2522; --today:#D9AE68; --today-soft:#352B1C; --ok:#7DC0AC; --ok-soft:#22342E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131917; --card:#1B2320; --ink:#DCE5E0; --muted:#8D9F97; --line:#2A3531;
  --hi:#1F2E29; --hi-ink:#DCE5E0; --pen:#7DC0AC; --pen-soft:#22342E;
  --late:#E38B83; --late-soft:#3A2522; --today:#D9AE68; --today-soft:#352B1C; --ok:#7DC0AC; --ok-soft:#22342E;
  color-scheme:dark}
body{margin:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 80px;display:flex;flex-direction:column;gap:22px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;margin:0;line-height:1}
h1 mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--display);font-size:1rem}

/* quick add */
.add{display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;gap:8px}
#q{flex:1;min-width:0;font-size:1.15rem;padding:14px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);outline:none}
#q:focus{border-color:var(--pen)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--pen);color:var(--card);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.small{padding:7px 12px;font-size:.9rem;border-radius:10px}
.preview{min-height:1.6em;font-size:.92rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--pen-soft);color:var(--pen);white-space:nowrap}
.chip.cls{color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.hint{font-size:.85rem;color:var(--muted)}
.hint code{font-family:var(--body);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 5px}

/* next card */
.next{background:var(--hi);color:var(--hi-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative}
.next .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.next h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.1;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.next .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.92rem;font-weight:700}
.next .meta > span:not(.chip){background:rgba(255,255,255,.55);padding:3px 10px;border-radius:999px}
.next .acts{display:flex;gap:8px;flex-wrap:wrap}
.next .acts .btn{background:var(--hi-ink);color:var(--hi)}
.next .acts .btn.ghost{background:transparent;color:var(--hi-ink);border-color:rgba(20,24,42,.3)}
.next.empty{background:var(--ok-soft);color:var(--ink)}
.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.quick button{border:1.5px solid rgba(20,24,42,.25);background:transparent;color:inherit;border-radius:999px;padding:3px 10px;font-weight:700}
.quick button[aria-pressed="true"]{background:var(--hi-ink);color:var(--hi)}

/* lists */
section.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:baseline;gap:10px}
.ghead h3{font-family:var(--display);font-weight:800;font-size:1.05rem;margin:0}
.ghead .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.group.late h3{color:var(--late)}
.group.today h3{color:var(--today)}
.task{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.task.late{border-color:var(--late);box-shadow:inset 4px 0 0 var(--late)}
.task.today{box-shadow:inset 4px 0 0 var(--today)}
.trow{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--ok);background:var(--ok-soft)}
.check svg{width:16px;height:16px;opacity:0}
.check:hover svg{opacity:.5}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{opacity:1;stroke:var(--card)}
.tmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;gap:3px}
.ttitle{font-weight:700;overflow-wrap:anywhere}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.due{font-weight:700}
.due.late{color:var(--late)} .due.today{color:var(--today)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.go{flex:none;border:0;background:var(--pen-soft);color:var(--pen);border-radius:10px;padding:7px 10px;font-weight:700;font-size:.85rem}
.tdetail{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);font-weight:700}
.field input{font-weight:400;font-size:1rem;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.estrow{display:flex;gap:6px;flex-wrap:wrap}
.estrow button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-weight:700;font-size:.85rem}
.estrow button[aria-pressed="true"]{background:var(--pen);color:var(--card);border-color:var(--pen)}
.steps{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:8px}
.steps input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.steps .st{flex:1;min-width:0;overflow-wrap:anywhere}
.steps li.d .st{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--late)}
.stepadd{display:flex;gap:6px}
.stepadd input{flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.drow{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.drow .l{display:flex;gap:8px;flex-wrap:wrap}
.danger{color:var(--late)!important}
.nudge{background:var(--today-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.9rem}

.empty-state{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.empty-state h2{font-family:var(--display);font-weight:800;margin:0;font-size:1.4rem}
.tries{display:flex;flex-direction:column;gap:6px}
.tries button{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
.tries button:hover{border-color:var(--pen)}
details.donebox summary{cursor:pointer;color:var(--muted);font-weight:700;padding:4px 0}
details.donebox[open] summary{margin-bottom:8px}
.donelist{display:flex;flex-direction:column;gap:8px}
footer{font-size:.82rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.sync.on::before{background:var(--ok)}

/* focus */
#focus{position:fixed;inset:0;background:var(--paper);z-index:10;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.fwrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.fwrap .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fwrap h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.ring{position:relative;width:min(240px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--pen);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,10vw,3.4rem);font-variant-numeric:tabular-nums}
.fsteps{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fsteps .lbl{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:6px}
.frow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg{font-weight:700;color:var(--pen)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--hi);font-weight:700;padding:0}
/* canvas */
.hbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem;white-space:nowrap}
.hbtn.on{border-color:var(--ok);color:var(--ok)}
.canvas{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.canvas h2{font-family:var(--display);font-weight:800;margin:0;font-size:1.25rem}
.canvas ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:12px}
.canvas li{padding-left:4px}
.canvas li > p{margin:0 0 6px}
.canvas .row{display:flex;gap:8px;flex-wrap:wrap}
.canvas .row input{flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
p.small{font-size:.85rem;color:var(--muted)}
.banner{background:var(--pen-soft);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
a.link{color:var(--pen);font-weight:700}

/* ---- calm & focused overrides ---- */
.wrap{max-width:620px;gap:28px;padding-block:28px 96px}
h1{font-weight:600;font-size:1.35rem;letter-spacing:-.01em;color:var(--muted)}
h1 mark{background:none;color:var(--pen);padding:0}
.pill{background:transparent;border-color:transparent;color:var(--muted);padding:4px 6px}
.pill b{font-family:var(--display);font-weight:600;color:var(--ink)}
.hbtn{background:transparent;color:var(--muted);border-color:var(--line)}
#q{border-width:1.5px;border-radius:16px;background:var(--card);font-size:1.05rem}
.btn{border-radius:14px;font-weight:700}
.chip{font-weight:600}
.dayline{color:var(--muted);font-size:.95rem;margin:0 0 12px;text-align:center}
.dayline b{color:var(--ink);font-weight:700}
.next{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:32px 24px;align-items:center;text-align:center;gap:16px}
.next .eyebrow{color:var(--pen);opacity:1;letter-spacing:.1em}
.next h2{font-weight:500;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.2;max-width:22ch}
.next .meta{justify-content:center;font-weight:600;color:var(--muted)}
.next .meta > span:not(.chip){background:var(--paper)}
.next .acts{justify-content:center;flex-direction:column;align-items:stretch;width:100%;max-width:320px}
.next .acts .btn{background:var(--pen);color:var(--card);font-size:1.1rem;padding:16px 20px}
.next .acts .more{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.next .acts .btn.ghost{background:transparent;color:var(--muted);border:0;font-size:.92rem;padding:8px 10px;font-weight:600}
.next .acts .btn.ghost:hover{color:var(--ink);background:var(--paper)}
.next.empty{background:var(--card)}
.quick{justify-content:center;color:var(--muted)}
.quick button{border-color:var(--line);color:var(--muted)}
.quick button[aria-pressed="true"]{background:var(--pen);color:var(--card);border-color:var(--pen)}
.ghead h3{font-weight:500;font-size:1rem;color:var(--muted)}
.group.late h3{color:var(--late)} .group.today h3{color:var(--ink)}
.task{border-color:var(--line);border-radius:16px;background:var(--card)}
.task.late,.task.today{box-shadow:none;border-color:var(--line)}
.task.late .due{color:var(--late)}
.check{border-width:2px;border-color:var(--line);width:28px;height:28px}
.ttitle{font-weight:600}
.go{background:transparent;color:var(--muted)}
.go:hover{background:var(--pen-soft);color:var(--pen)}
.imp{color:var(--late);font-weight:700}
.showall{align-self:center;background:transparent;border:1.5px dashed var(--line);color:var(--muted);border-radius:999px;padding:9px 18px;font-weight:600}
.showall:hover{color:var(--ink);border-color:var(--muted)}
.empty-state{border-style:solid;border-width:1px;background:var(--card)}
.empty-state h2{font-weight:500}
.banner{background:var(--card);border:1px solid var(--line)}
.ring .fg{stroke:var(--pen)}
.fwrap h2{font-weight:500}
.ring .t{font-weight:500}
.next .btn.hi,.btn.hi{background:var(--pen);color:var(--card)}

/* ---- class colors ---- */
.chip.cls{background:color-mix(in srgb,var(--c) 16%,var(--card));color:var(--ink)}
.chip.cls .dot{background:var(--c)}
.task.has-cls{border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 6%,var(--card))}
.task.has-cls .check{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.task.has-cls .check:hover{background:color-mix(in srgb,var(--c) 15%,var(--card));border-color:var(--c)}
.task.done.has-cls{border-left-color:var(--line);background:var(--card)}
.next.has-cls{border-top:8px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--card))}
.next.has-cls .eyebrow{color:var(--c)}
.next.has-cls .acts .btn:not(.ghost){background:var(--c);color:#fff}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.legend .lbl{font-size:.82rem;color:var(--muted);margin-right:4px}
.legend button{border:0;cursor:pointer}

/* ---- view switch + calendar ---- */
.seg{display:inline-flex;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;padding:6px 16px;border-radius:999px}
.seg button[aria-selected="true"]{background:var(--pen);color:var(--card)}
.cal{display:flex;flex-direction:column;gap:12px}
.cal-head{display:flex;align-items:center;gap:6px}
.cal-head h3{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0;min-width:9.5em;text-align:center}
.cal-head .x{font-size:1.5rem;line-height:1;padding:2px 10px}
.cal-head .btn{margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:.75rem;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal-day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;overflow:hidden;color:var(--ink)}
.cal-day.out{opacity:.45}
.cal-day .num{font-size:.8rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cal-day.today .num{background:var(--pen);color:var(--card);border-radius:999px;padding:0 7px;align-self:flex-start}
.cal-day.sel{border:2px solid var(--pen);padding:4px}
.cal-day.late .num{color:var(--late)}
.cal-day .items{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-day .it{display:flex;align-items:center;gap:4px;font-size:.72rem;line-height:1.2;min-width:0;background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:5px;padding:1px 4px}
.cal-day .it i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.cal-day .it .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cal-day .it.done{opacity:.5;text-decoration:line-through}
.cal-day .more{font-size:.7rem;color:var(--muted);font-weight:700}
.cal-sel{display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (max-width:560px){
  .cal-day{min-height:58px;align-items:center;padding:4px 2px}
  .cal-day.sel{padding:3px 1px}
  .cal-day .items{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .cal-day .it{background:none;padding:0}
  .cal-day .it .tx{display:none}
  .cal-day .it i{width:8px;height:8px}
  .cal-day.today .num{align-self:center}
}
@media (max-width:480px){.addrow .btn{padding:12px 14px}.trow{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Homework <mark>HQ</mark></h1>
    <div class="stats">
      <span class="pill" title="Days in a row with at least one thing done"><b id="streak">0</b> day streak</span>
      <span class="pill"><b id="doneToday">0</b> done today</span>
      <button class="hbtn" id="canvasBtn" aria-expanded="false">Canvas</button>
    </div>
  </header>
  <div id="canvasSlot"></div>

  <div class="add">
    <div class="addrow">

<script>
(() => {
"use strict";
// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diff = (a, b) => Math.round((fromYmd(a) - fromYmd(b)) / 864e5);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

  const d = diff(t.due, today()), tm = t.time ? " " + fmtTime(t.time) : "";
  if (d < 0) return { text: (d === -1 ? "Due yesterday" : "Overdue " + (-d) + " days"), cls: "late" };
  if (d === 0) return { text: "Due today" + tm, cls: "today" };
  if (d === 1) return { text: "Tomorrow" + tm, cls: "" };
  const dt = fromYmd(t.due);
  if (d < 7) return { text: DOW[dt.getDay()] + tm, cls: "" };
  return { text: MON[dt.getMonth()].replace(/^./, c => c.toUpperCase()) + " " + dt.getDate() + tm, cls: "" };
}
const fmtEst = m => !m ? "" : m < 60 ? m + " min" : (m % 60 ? (m / 60).toFixed(1).replace(/\.0$/, "") : m / 60) + " hr";

// ---------- parsing ----------
const SUBJECTS = "math algebra geometry calc calculus precalc stats english lit literature writing bio biology chem chemistry physics science earth history apush gov government civics econ economics psych psychology sociology spanish french german latin chinese mandarin japanese italian art music band choir cs coding compsci health pe theater drama religion philosophy".split(" ");
const WD = { sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,weds:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6 };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function knownClasses() { const s = new Set(); state.tasks.forEach(t => t.cls && s.add(t.cls.toLowerCase())); return s; }

function parse(raw) {
  let s = " " + raw.trim() + " ";
  const out = { title: "", cls: "", due: null, time: null, est: null, important: false, dateGiven: false };
  const take = (re, fn) => { const m = s.match(re); if (m) { fn(m); s = s.replace(re, " "); return true; } return false; };
  const t0 = today();
  take(/\s(!+|urgent|important)(?=\s)/i, () => out.important = true);
  take(/\s#([\w-]+)(?=\s)/, m => out.cls = cap(m[1]));
  take(/\s(\d+(?:\.\d+)?)\s?(m|min|mins|minutes|h|hr|hrs|hour|hours)(?=\s)/i, m => { const n = parseFloat(m[1]); out.est = Math.round(/^h/i.test(m[2]) ? n * 60 : n); });
  take(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i, m => { let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; out.time = pad(h) + ":" + (m[2] || "00"); })
    || take(/\s(?:at\s)?(\d{1,2}):(\d{2})(?=\s)/, m => out.time = pad(+m[1]) + ":" + m[2])
    || take(/\s(?:at\s)?(noon|midnight)(?=\s)/i, m => out.time = /noon/i.test(m[1]) ? "12:00" : "23:59");

  const dateTakers = [
    [new RegExp("\\s" + pre + "(today|tonight)(?=\\s)", "i"), () => t0],
    [new RegExp("\\s" + pre + "(tomorrow|tmrw|tmr|tmw)(?=\\s)", "i"), () => addDays(t0, 1)],
    [new RegExp("\\s" + pre + "next\\sweek(?=\\s)", "i"), () => addDays(t0, 7)],
    [new RegExp("\\s" + pre + "in\\s(\\d+)\\s?(day|days|d|week|weeks|w)(?=\\s)", "i"), m => addDays(t0, +m[1] * (/^w/i.test(m[2]) ? 7 : 1))],
    [new RegExp("\\s" + pre + "(next\\s)?(" + Object.keys(WD).join("|") + ")\\.?(?=\\s)", "i"), m => {

      let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;

    [new RegExp("\\s" + pre + "(" + MON.join("|") + ")[a-z]*\\.?\\s(\\d{1,2})(?:st|nd|rd|th)?(?=\\s)", "i"), m => {

}

// ---------- class colours ----------
const HUES = [222, 340, 160, 28, 268, 190, 0, 95, 300, 45];
// Each class keeps one color from a calm, easy-to-tell-apart set. Tap a class in "Your classes" to change it.
const CLASS_COLORS = ["#4A78B8", "#C8664F", "#8A5AA8", "#B8892A", "#3E8E7E", "#B85578", "#6E8B3D", "#5B6B8C", "#2E8FA8", "#A0663A"];
function clsIndex(name) {
  const k = name.toLowerCase(), m = state.prefs.classColors || (state.prefs.classColors = {});
  if (m[k] == null) { const used = new Set(Object.values(m)); let i = 0; while (used.has(i) && i < CLASS_COLORS.length) i++; m[k] = i % CLASS_COLORS.length; savePrefs(); }
  return m[k];
}
function clsColor(name) { return name ? CLASS_COLORS[clsIndex(name)] : "var(--line)"; }
function cycleClassColor(name) { const m = state.prefs.classColors, k = name.toLowerCase(); m[k] = ((m[k] ?? 0) + 1) % CLASS_COLORS.length; savePrefs(); render(); }

// ---------- setup ----------
// Paste your Google OAuth "Web application" client ID here (see README.md).
const GOOGLE_CLIENT_ID = "53170955710-d32cspoetr4r0svs4nkoji28dojf5jtd.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.appdata";

// ---------- state & storage ----------
// Saved in this browser right away, and copied to a private file in your own Google Drive
// (the hidden app-data folder) so your phone and laptop see the same list.
const LS = "hwhq.v1";
const state = { tasks: new Map(), prefs: { history: {}, deleted: {} }, open: null, quickWin: false, skipped: new Set(), token: null, tokenExp: 0 };
function lsLoad() { try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j) { (j.tasks || []).forEach(t => state.tasks.set(t.id, t)); state.prefs = Object.assign({ history: {}, deleted: {} }, j.prefs); } } catch (e) {} }
function lsSave() { try { localStorage.setItem(LS, JSON.stringify({ tasks: [...state.tasks.values()], prefs: state.prefs })); } catch (e) {} }
let saveT = null;
function cloudSoon() { if (!state.token) return; clearTimeout(saveT); saveT = setTimeout(cloudSave, 1500); }
function saveTask(t) { t.updated = Date.now(); state.tasks.set(t.id, t); delete state.prefs.deleted[t.id]; lsSave(); render(); cloudSoon(); }
function deleteTask(id) { state.tasks.delete(id); state.prefs.deleted[id] = Date.now(); lsSave(); render(); cloudSoon(); }
function savePrefs() { state.prefs.updated = Date.now(); lsSave(); cloudSoon(); }
const newId = () => "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function setSync(on) { const el = document.getElementById("sync"); el.className = "sync" + (on ? " on" : ""); el.textContent = on ? "Backed up to your Google Drive, so it follows you to your phone and laptop" : GOOGLE_CLIENT_ID ? "Saved on this device. Connect Google to sync." : "Saved on this device"; }

// ---------- google sign-in ----------
let tokenClient = null, pendingSignIn = null;
function initGoogle() {
  if (!GOOGLE_CLIENT_ID) return;
  const ready = () => window.google && google.accounts && google.accounts.oauth2;
  const go = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: SCOPES, callback: r => {
      if (r && r.access_token) { state.token = r.access_token; state.tokenExp = Date.now() + (r.expires_in || 3600) * 1000 - 60000; try { localStorage.setItem("hwhq.signedIn", "1"); } catch (e) {} afterSignIn(); }

      error_callback: () => { state.gcal = { status: "signin", msg: "" }; render(); } });
    let was = false; try { was = localStorage.getItem("hwhq.signedIn") === "1"; } catch (e) {}

  };

}
function signIn() { if (tokenClient) tokenClient.requestAccessToken({ prompt: state.token ? "" : "consent" }); }

  if (r.status === 401) { state.token = null; const e = new Error("signin"); e.code = "signin"; throw e; }

// ---------- drive backup (one JSON file in the hidden app-data folder) ----------
const DRIVE = "https://www.googleapis.com/drive/v3/files", UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";
let fileId = null;
async function cloudLoad() {
  try {
    const l = await gfetch(DRIVE + "?spaces=appDataFolder&fields=files(id,name)&q=" + encodeURIComponent("name='homework-hq.json'"));
    if (!l.files || !l.files.length) { await cloudSave(); return; }
    fileId = l.files[0].id;
    const remote = await gfetch(DRIVE + "/" + fileId + "?alt=media");
    merge(remote || {}); lsSave(); render();
    cloudSave();
  } catch (e) { if (e.code === "signin") { state.gcal = { status: "signin", msg: "" }; render(); } }
}
function merge(remote) {
  const del = Object.assign({}, remote.prefs && remote.prefs.deleted, state.prefs.deleted);
  (remote.tasks || []).forEach(t => { const mine = state.tasks.get(t.id); if ((!mine || (mine.updated || 0) < (t.updated || 0)) && !(del[t.id] >= (t.updated || 0))) state.tasks.set(t.id, t); });
  Object.keys(del).forEach(id => { const t = state.tasks.get(id); if (t && del[id] >= (t.updated || 0)) state.tasks.delete(id); });

async function cloudSave() {

  try {
    if (fileId) await gfetch(UPLOAD + "/" + fileId + "?uploadType=media", { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
    else {
      const b = "hwhq" + Math.random().toString(36).slice(2);
      const multi = "--" + b + "\r\nContent-Type: application/json\r\n\r\n" + JSON.stringify({ name: "homework-hq.json", parents: ["appDataFolder"] }) + "\r\n--" + b + "\r\nContent-Type: application/json\r\n\r\n" + body + "\r\n--" + b + "--";
      const f = await gfetch(UPLOAD + "?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + b }, body: multi });

// ---------- logic ----------
const open = () => [...state.tasks.values()].filter(t => !t.done);
function sortKey(t) { return (t.due || "9999-12-31") + (t.important ? "0" : "1") + (t.time || "23:59") + String(t.est || 999).padStart(4, "0"); }
function pickNext() {
  let list = open().sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1);
  if (state.quickWin) list = list.filter(t => t.est && t.est <= 15 || stepsLeft(t) && t.steps.length);
  const notSkipped = list.filter(t => !state.skipped.has(t.id));

}
const stepsLeft = t => (t.steps || []).filter(s => !s.done).length;
function streak() {
  const h = state.prefs.history || {}; let d = today(), n = 0;

  return n;
}

function complete(t, fromEl) {
  t.done = true; t.doneAt = Date.now();
  const d = today(); state.prefs.history[d] = (state.prefs.history[d] || 0) + 1; savePrefs();
  state.skipped.delete(t.id);

  const left = open().filter(x => x.due && diff(x.due, today()) <= 0).length;
  const lines = ["Done. Nice.", "Crossed off!", "That's one less thing.", "Look at you go.", "Boom. Next?", "Brain: lighter."];
  toast(lines[Math.floor(Math.random() * lines.length)] + (left ? " " + left + " left for today." : " Nothing else due today."), "Undo", () => {
    t.done = false; t.doneAt = null; state.prefs.history[d] = Math.max(0, (state.prefs.history[d] || 1) - 1); if (!state.prefs.history[d]) delete state.prefs.history[d]; savePrefs(); saveTask(t);
  });
}
function uncomplete(t) { t.done = false; t.doneAt = null; saveTask(t); }
function snooze(t) { t.due = addDays(t.due && diff(t.due, today()) >= 0 ? t.due : today(), 1); t.snoozes = (t.snoozes || 0) + 1; saveTask(t); toast("Moved to " + dueLabel(t).text.toLowerCase() + ".", "Undo", () => { t.due = addDays(t.due, -1); t.snoozes--; saveTask(t); }); }

function addFromText(text) {
  const lines = text.split(/\n|;/).map(s => s.replace(/^\s*[-*•\d.)\]]+\s*/, "").trim()).filter(Boolean);
  let n = 0;
  lines.forEach(line => { const p = parse(line); if (!p.title) return; n++;
    saveTask({ id: newId(), title: p.title, cls: p.cls, due: p.due, time: p.time, est: p.est, important: p.important, steps: [], done: false, created: Date.now(), snoozes: 0 }); });
  if (n > 1) toast("Added " + n + " things.");

}

// ---------- rendering ----------

const clsChip = c => c ? h("span", { class: "chip cls", style: "--c:" + clsColor(c) }, h("span", { class: "dot" }), c) : null;

function renderPreview() {

  if (!v.trim() && state.addDue) { el.append(h("span", { class: "chip" }, "Due " + dueLabel({ due: state.addDue }).text.replace(/^Due /, "")), h("span", null, "Just type what it is."), h("button", { class: "x", "aria-label": "Cancel", onclick: () => { state.addDue = null; renderPreview(); } }, "×")); return; }

      h("div", { class: "tries" }, ["math problem set 3.2 tomorrow 30m", "english essay outline fri 11:59pm !", "chem lab report next mon 1h", "spanish vocab quiz study wed 15m"].map(s =>
        h("button", { onclick: () => { addFromText(s); } }, s))),

    h("div", { class: "acts" },

// ---------- input wiring ----------
const q = $("q");
